server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /huleedu-system-overview/;
    }

    location = /huleedu-system-overview {
        return 308 /huleedu-system-overview/;
    }

    location /huleedu-system-overview/ {
        add_header Cache-Control "no-store" always;
        expires -1;
        try_files $uri $uri/ =404;
    }

    location ~* ^/evidence/.*\.(?:png|jpe?g|webp|svg)$ {
        add_header Cache-Control "public, max-age=604800, immutable" always;
        expires 7d;
        try_files $uri =404;
    }

    location /evidence/ {
        add_header Cache-Control "no-store" always;
        expires -1;
        try_files $uri $uri/ =404;
    }

    location = /code {
        return 308 /code/;
    }

    location ~ "^/code/(?<revision>[0-9a-f]{40})$" {
        add_header Cache-Control "no-store" always;
        expires -1;
        return 308 /code/$revision/;
    }

    location ~ "^/code/(?<revision>[0-9a-f]{40})/$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        root /srv/huleedu-publication/$revision;
        try_files /code/$revision/index.html @code_revision_not_found;
    }

    location ~ "^/code/(?<revision>[0-9a-f]{40})/source/.+\.html$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        root /srv/huleedu-publication/$revision;
        try_files $uri @code_revision_not_found;
    }

    location @code_revision_not_found {
        add_header Cache-Control "no-store" always;
        expires -1;
        return 404;
    }

    location /code/ {
        add_header Cache-Control "no-store" always;
        root /srv/huleedu-publication/current;
        expires -1;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
